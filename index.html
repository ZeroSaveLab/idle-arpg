<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Idle ARPG</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand">⚔ <span>Idle ARPG</span></div>
  <nav class="topnav">
    <button class="nav-btn active" data-panel="mapsPanel">Mapas</button>
    <button class="nav-btn" data-panel="inventoryPanel">Inventário</button>
    <button class="nav-btn" data-panel="characterPanel">Personagem</button>
  </nav>
  <button id="resetBtn" class="small-btn">Resetar</button>
</header>
<section class="hud-row">
  <div class="stat-card"><span>Nível</span><strong id="level">1</strong></div>
  <div class="stat-card"><span>Mapa</span><strong id="mapName">Floresta de Pedra</strong></div>
  <div class="stat-card"><span>Ouro</span><strong id="gold">0</strong></div>
  <div class="stat-card"><span>Abates</span><strong id="kills">0</strong></div>
</section>
<section class="game-shell">
<canvas id="gameCanvas" width="1280" height="720"></canvas>
<div class="floating-status">
<div class="bar-line"><span>Vida</span><span id="hpText">100 / 100</span></div>
<div class="bar"><div id="hpBar" class="fill hp"></div></div>
<div class="bar-line"><span>Experiência</span><span id="xpText">0 / 100</span></div>
<div class="bar"><div id="xpBar" class="fill xp"></div></div>
<div id="status" class="status">Preparando...</div>
</div>
</section>
<section class="bottom-grid">
<div class="panel"><div class="panel-title">Registro</div><div id="log"></div></div>
<div class="panel"><div class="panel-title">Equipado</div><div id="quickGear" class="quick-gear"></div></div>
</section>
</div>

<div id="overlay" class="overlay hidden">
<div class="modal">
<div class="modal-head"><h2 id="modalTitle">Mapas</h2><button id="closeModal" class="close-btn">×</button></div>
<div id="mapsPanel" class="modal-panel"></div>
<div id="inventoryPanel" class="modal-panel hidden"></div>
<div id="characterPanel" class="modal-panel hidden"></div>
</div>
</div>

<script src="js/assets.js"></script>
<script src="js/data.js"></script>
<script src="js/game.js"></script>
</body>
</html>
